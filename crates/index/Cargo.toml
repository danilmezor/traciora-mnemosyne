[package]
name = "mnemosyne-index"
version = "0.1.0"
edition = "2021"
description = "Persistent full-text search index over a mnemosyne vault, built on tantivy."
license = "Apache-2.0"

[dependencies]
mnemosyne-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.26"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
