[package]
name = "mnemosyne"
version = "0.1.0"
edition = "2021"
description = "A clean-room Markdown knowledge base CLI over plain vault folders."
license = "Apache-2.0"

[[bin]]
name = "mnemosyne"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
mnemosyne-core = { path = "../core" }
mnemosyne-index = { path = "../index" }
mnemosyne-engine = { path = "../engine" }
mnemosyne-content = { path = "../content" }
notify = "8"
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSPathUtilities", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
